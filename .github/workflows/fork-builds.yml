# Builds the companion for Windows, macOS and Linux from this branch and publishes the programs as a
# pre-release of this fork, so changes not yet released upstream can be tried. Runs on every push to
# the `builds` branch, or by hand from the Actions tab.
name: Fork builds

on:
  push:
    branches: [builds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # tools/build-exe.js needs Node 25.5 or later (--build-sea).
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - run: npm test
      - run: node tools/build-exe.js
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -bd "MelvorIdle2Companion-${{ matrix.name }}.zip" MelvorIdle2Companion.exe > /dev/null
          else
            zip -q "MelvorIdle2Companion-${{ matrix.name }}.zip" MelvorIdle2Companion
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MelvorIdle2Companion-${{ matrix.name }}
          path: dist/MelvorIdle2Companion-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.zip --target "$GITHUB_SHA" --prerelease \
            --title "${version} (build ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7})" \
            --notes "Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Unsigned: Windows SmartScreen asks first (More info → Run anyway); on macOS, right-click → Open the first time."
